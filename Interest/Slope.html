<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slope Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#2563eb;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 12px 30px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:26px;
}

h1{
  margin:0;
  color:var(--blue);
}

.subtitle{
  color:var(--muted);
  margin-top:6px;
}

label{
  font-weight:600;
  font-size:14px;
}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:16px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:15px;
}

.grid-input{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--blue);
  color:white;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:#eef2ff;
  color:#111;
  margin-top:10px;
}

.results{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  margin-top:30px;
}

.box{
  background:#f9fafb;
  border-radius:12px;
  padding:22px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  background:#e0e7ff;
  color:#1e3a8a;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  margin-bottom:10px;
}

@media(max-width:900px){
  .grid-input{grid-template-columns:1fr}
  .results{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<!-- INPUT CARD -->
<div class="card">
  <h1>Slope Calculator</h1>
  <p class="subtitle">Find slope, line equation, distance & line type using two points</p>

  <div class="grid-input">
    <div>
      <label>x₁</label>
      <input id="x1" value="1">
    </div>
    <div>
      <label>y₁</label>
      <input id="y1" value="2">
    </div>
    <div>
      <label>x₂</label>
      <input id="x2" value="4">
    </div>
  </div>

  <label>y₂</label>
  <input id="y2" value="6">

  <button onclick="calculate()">Calculate Slope</button>
  <button class="secondary" onclick="resetAll()">Reset</button>
</div>

<!-- RESULTS -->
<div class="results">
  <div class="box">
    <span class="badge">Final Result</span>
    <div id="result"></div>
  </div>

  <div class="box">
    <span class="badge">Details</span>
    <div id="details"></div>
  </div>
</div>

</div>

<script>
function calculate(){
  const x1=Number(document.getElementById("x1").value);
  const y1=Number(document.getElementById("y1").value);
  const x2=Number(document.getElementById("x2").value);
  const y2=Number(document.getElementById("y2").value);

  if(x1===x2){
    document.getElementById("result").innerHTML="<b>Undefined slope (vertical line)</b>";
    document.getElementById("details").innerHTML="";
    return;
  }

  const m=(y2-y1)/(x2-x1);
  const b=y1-m*x1;
  const d=Math.sqrt((x2-x1)**2+(y2-y1)**2);

  let type="Positive slope";
  if(m<0) type="Negative slope";
  if(m===0) type="Horizontal line";

  document.getElementById("result").innerHTML=`
    <b>Slope (m):</b> ${m.toFixed(6)}<br>
    <b>Line Type:</b> ${type}
  `;

  document.getElementById("details").innerHTML=`
    <b>Equation:</b> y = ${m.toFixed(6)}x + ${b.toFixed(6)}<br>
    <b>Distance between points:</b> ${d.toFixed(6)}
  `;
}

function resetAll(){
  document.getElementById("x1").value="";
  document.getElementById("y1").value="";
  document.getElementById("x2").value="";
  document.getElementById("y2").value="";
  document.getElementById("result").innerHTML="";
  document.getElementById("details").innerHTML="";
}
</script>

</body>
</html>
